name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore Steam dependencies
        run: dotnet restore NotePadMod/NotePadMod.csproj -p:GamePlatform=Steam

      - name: Build Steam DLL
        run: dotnet build NotePadMod/NotePadMod.csproj --configuration Release -p:GamePlatform=Steam --no-restore

      - name: Upload Steam DLL
        uses: actions/upload-artifact@v4
        with:
          name: NotePadMod
          path: NotePadMod/bin/Release/net6.0/NotePadMod.dll

      - name: Restore Android dependencies
        run: dotnet restore NotePadMod/NotePadMod.csproj -p:GamePlatform=Android

      - name: Build Android DLL
        run: dotnet build NotePadMod/NotePadMod.csproj --configuration Release -p:GamePlatform=Android --no-restore

      - name: Upload Android DLL
        uses: actions/upload-artifact@v4
        with:
          name: NotePadMod-Android
          path: NotePadMod/bin/Release/net6.0/NotePadMod-Android.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NotePadMod/bin/Release/net6.0/NotePadMod.dll
            NotePadMod/bin/Release/net6.0/NotePadMod-Android.dll
